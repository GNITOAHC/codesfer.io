<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2b2d31" />
		<meta name="color-scheme" content="dark light" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Codesfer" />
		<!-- Social card defaults. These never vary per page, so they live in the
		     shell; og:title/og:description are set per route, og:url in the root
		     layout. The image URL must be absolute — unfurlers do not resolve
		     relative paths. Regenerate it from src/lib/assets/og-image.source.html. -->
		<meta property="og:image" content="https://codesfer.io/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Codesfer — share code snippets securely from your terminal"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<!-- Fonts are self-hosted; see the @font-face block in src/routes/layout.css.
		     Only the Latin sans subset is preloaded — it covers all above-the-fold
		     text on every page. Preloading the other 12 subsets would recreate the
		     render-blocking problem this replaced. crossorigin is required even
		     same-origin: font fetches are always CORS-mode, and without it the
		     preload is discarded and the file fetched twice. -->
		<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
