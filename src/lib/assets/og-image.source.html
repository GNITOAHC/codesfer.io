<!doctype html>
<!--
  Source for static/og.png, the 1200x630 social preview card. Not served and not
  imported by anything — kept only so the card can be regenerated when the
  tagline or brand colours change, which a PNG alone does not allow.

  Regenerate with:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot=out.png file://$PWD/src/lib/assets/og-image.source.html
    magick out.png -strip -define png:compression-level=9 static/og.png

  The headline and paragraph must stay identical to the homepage <title> and
  meta description in src/routes/(app)/+page.svelte. Colours come from
  src/routes/layout.css (--primary) and the theme-color in src/app.html.
  Keep the output under ~300 KB; several unfurlers silently drop larger files.
-->
<html>
	<head>
		<meta charset="utf-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=block"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				width: 1200px;
				height: 630px;
				background: #2b2d31;
				font-family: Inter, sans-serif;
				color: #fff;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 0 88px;
				position: relative;
				overflow: hidden;
			}
			.glow {
				position: absolute;
				top: -280px;
				left: -160px;
				width: 900px;
				height: 900px;
				background: radial-gradient(
					circle,
					oklch(0.5854 0.2041 277.1173 / 0.28) 0%,
					transparent 62%
				);
			}
			.mark {
				display: flex;
				align-items: center;
				gap: 18px;
				margin-bottom: 40px;
			}
			.mark svg {
				width: 52px;
				height: 52px;
			}
			.mark span {
				font-size: 34px;
				font-weight: 600;
				letter-spacing: -0.01em;
				color: #e8e9ec;
			}
			h1 {
				font-size: 76px;
				font-weight: 700;
				line-height: 1.06;
				letter-spacing: -0.032em;
				max-width: 15ch;
			}
			p {
				margin-top: 30px;
				font-size: 30px;
				line-height: 1.42;
				color: #a7abb4;
				max-width: 30ch;
			}
			code {
				margin-top: 40px;
				display: inline-block;
				align-self: flex-start;
				font-family: 'JetBrains Mono', monospace;
				font-size: 25px;
				color: #cfd3da;
				background: rgba(255, 255, 255, 0.06);
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: 10px;
				padding: 15px 24px;
			}
			code b {
				color: oklch(0.7 0.17 277.1173);
				font-weight: 400;
			}
		</style>
	</head>
	<body>
		<div class="glow"></div>
		<div class="mark">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				viewBox="0 0 24 24"
				fill="none"
				stroke="oklch(0.6801 0.1583 276.9349)"
				stroke-width="2.5"
				stroke-linecap="round"
				stroke-linejoin="round"
			>
				<path d="M12 19h8" />
				<path d="m4 17 6-6-6-6" />
			</svg>
			<span>Codesfer</span>
		</div>
		<h1>Share code snippets securely from your terminal.</h1>
		<p>
			A CLI tool and self-hostable server for sending and receiving code with optional encryption.
		</p>
		<code><b>$</b> codesfer push main.go -k my-snippet --pass secret</code>
	</body>
</html>
